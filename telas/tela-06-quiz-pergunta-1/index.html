<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pergunta 1: Ano Escolar · Central OBI UFABC</title>
  <script src="../../assets/js/preferences.js"></script>
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../assets/css/screens.css">
  <script src="../../assets/js/utils.js" defer></script>
  <script src="script.js" defer></script>
  <link rel="stylesheet" href="../../assets/css/responsive.css">
  <script src="../../assets/js/external-links.js" defer></script>
</head>
<body>

  <main class="mobile-viewport layout-quiz">

    <header class="accessibility-bar" aria-label="Controles de Acessibilidade">
      <a href="../../index.html" class="brand-link" aria-label="Ir para a página inicial da Central OBI UFABC">
        <img class="brand-symbol" src="../../assets/img/obi-ufabc.jpeg" alt="" width="36" height="36"><span>OBI <small>UFABC</small></span>
      </a>
      <div class="accessibility-controls" role="group" aria-label="Ajustes visuais de fonte e contraste">
        <button id="btn-zoom-out" class="btn-a11y" type="button" aria-label="Diminuir tamanho da fonte">A-</button>
        <button id="btn-zoom-in" class="btn-a11y" type="button" aria-label="Aumentar tamanho da fonte">A+</button>
        <button id="btn-contrast" class="btn-a11y" type="button" aria-label="Alternar modo de alto contraste" aria-pressed="false">◐ Contraste</button>
      </div>
    </header>

    <nav class="page-header" aria-label="Navegação da tela">
      <a href="../../index.html" class="btn-back" aria-label="Voltar para a página inicial">
        <span aria-hidden="true">&larr;</span> Voltar
      </a>
    </nav>

    <section class="screen-content" aria-labelledby="screen-title">

      <div class="progress-container" aria-label="Progresso do Diagnóstico">
        <div class="progress-header">
          <span id="label-progresso-etapa">Pergunta 1 de 3</span>
          <span id="label-progresso-porcentagem" aria-hidden="true">33%</span>
        </div>
        <div class="progress-bar-track" 
             role="progressbar" 
             aria-valuenow="33" 
             aria-valuemin="0" 
             aria-valuemax="100" 
             aria-labelledby="label-progresso-etapa"
             aria-valuetext="Pergunta 1 de 3: 33 por cento concluído">
          <div class="progress-bar-fill w-33"></div>
        </div>
      </div>

      <h1 id="screen-title" class="screen-title">Descobrir Meu Nível</h1>
      <p class="screen-subtitle">Responda a 3 perguntas rápidas para descobrir sua categoria oficial na OBI.</p>

      <form id="form-pergunta-1" novalidate>
        <fieldset class="options-group" aria-describedby="status-feedback">
          <legend class="screen-subtitle quiz-legend" id="legend-pergunta-1">
            1. Qual é o seu ano ou série escolar atual?
          </legend>

          <label class="option-card" for="opt-fund1">
            <input type="radio" 
                   id="opt-fund1" 
                   name="ano_escolar" 
                   value="fundamental_1" 
                   aria-describedby="desc-fund1">
            <div class="option-text">
              <strong id="titulo-fund1">6º ou 7º ano do Ensino Fundamental</strong>
              <span id="desc-fund1">Modalidade Iniciação Nível 1 ou Programação Júnior.</span>
            </div>
          </label>

          <label class="option-card" for="opt-fund2">
            <input type="radio" 
                   id="opt-fund2" 
                   name="ano_escolar" 
                   value="fundamental_2" 
                   aria-describedby="desc-fund2">
            <div class="option-text">
              <strong id="titulo-fund2">8º ou 9º ano do Ensino Fundamental</strong>
              <span id="desc-fund2">Modalidade Iniciação Nível 2 ou Programação Júnior.</span>
            </div>
          </label>

          <label class="option-card" for="opt-medio">
            <input type="radio" 
                   id="opt-medio" 
                   name="ano_escolar" 
                   value="medio" 
                   aria-describedby="desc-medio">
            <div class="option-text">
              <strong id="titulo-medio">Ensino Médio ou Técnico (qualquer ano)</strong>
              <span id="desc-medio">Modalidade Programação (Nível Júnior, 1 ou 2).</span>
            </div>
          </label>

          <label class="option-card" for="opt-superior">
            <input type="radio" 
                   id="opt-superior" 
                   name="ano_escolar" 
                   value="superior" 
                   aria-describedby="desc-superior">
            <div class="option-text">
              <strong id="titulo-superior">1º ano do Ensino Superior (Graduação)</strong>
              <span id="desc-superior">Modalidade Programação Sênior.</span>
            </div>
          </label>
        </fieldset>

        <div id="status-feedback" 
             class="feedback-status" 
             role="status" 
             aria-live="polite" 
             aria-atomic="true">
        </div>

        <div class="screen-actions">
          <button type="button" id="btn-avancar" class="btn-primary">
            Avançar para Pergunta 2 &rarr;
          </button>
        </div>
      </form>

    </section>

  </main>

  <!-- Tradução automática de português para Libras (VLibras) -->
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js" defer></script>

</body>
</html>
