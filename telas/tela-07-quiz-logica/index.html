<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pergunta 2: Preferência de Desafios · Central OBI UFABC</title>
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <script src="../../assets/js/utils.js" defer></script>
</head>
<body>

  <main class="mobile-viewport">

    <header class="accessibility-bar" aria-label="Controles de Acessibilidade">
      <a href="../../index.html" class="brand-link">
        <span>Central OBI</span>
      </a>
      <div class="accessibility-controls">
        <button id="btn-zoom-out" class="btn-a11y" aria-label="Diminuir tamanho da fonte">A-</button>
        <button id="btn-zoom-in" class="btn-a11y" aria-label="Aumentar tamanho da fonte">A+</button>
        <button id="btn-contrast" class="btn-a11y" aria-label="Ativar alto contraste">◐ Contraste</button>
      </div>
    </header>

    <nav class="page-header" aria-label="Navegação da tela">
      <a href="../tela-06-quiz-pergunta-1/index.html" class="btn-back">
        <span aria-hidden="true">&larr;</span> Voltar
      </a>
    </nav>

    <section class="screen-content">

      <div class="progress-container" aria-label="Progresso do Diagnóstico">
        <div class="progress-header">
          <span>Pergunta 2 de 3</span>
          <span>66%</span>
        </div>
        <div class="progress-bar-track" role="progressbar" aria-valuenow="66" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-bar-fill" style="width: 66%;"></div>
        </div>
      </div>

      <h1 class="screen-title">Descobrir Meu Nível</h1>
      <p class="screen-subtitle">Escolha o formato que combina mais com você.</p>

      <fieldset class="options-group">
        <legend class="screen-subtitle" style="margin-bottom: 12px; font-weight: 600; color: var(--cor-texto-principal);">
          2. Qual é a sua preferência na hora de resolver desafios?
        </legend>

        <label class="option-card" for="opt-logica">
          <input type="radio" id="opt-logica" name="preferencia" value="logica">
          <div class="option-text">
            <strong>Lógica e enigmas no papel</strong>
            <span>Resolver desafios de raciocínio sem precisar programar (Modalidade Iniciação).</span>
          </div>
        </label>

        <label class="option-card selected" for="opt-codigo">
          <input type="radio" id="opt-codigo" name="preferencia" value="codigo" checked>
          <div class="option-text">
            <strong>Escrever código no computador</strong>
            <span>Programar soluções em Python, C/C++, Java ou JavaScript (Modalidade Programação).</span>
          </div>
        </label>
      </fieldset>

      <div class="screen-actions">
        <button type="button" id="btn-avancar" class="btn-primary" onclick="avancarParaApoio()">
          Avançar para Pergunta 3 &rarr;
        </button>
      </div>

    </section>

  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const respostas = typeof obterRespostas === 'function' ? obterRespostas() : {};
      const valorSalvo = respostas['preferencia'] || respostas['preferencia_estudo'];
      if (valorSalvo) {
        const radio = document.querySelector('input[name="preferencia"][value="' + valorSalvo + '"]');
        if (radio) {
          radio.checked = true;
          document.querySelectorAll('.option-card').forEach(function (cartao) {
            cartao.classList.remove('selected');
          });
          const cardPai = radio.closest('.option-card');
          if (cardPai) {
            cardPai.classList.add('selected');
          }
        }
      }
    });

    function avancarParaApoio() {
      const selecionado = document.querySelector('input[name="preferencia"]:checked');
      const valor = selecionado ? selecionado.value : 'logica';
      salvarResposta('preferencia', valor);
      salvarResposta('preferencia_estudo', valor);
      window.location.href = '../tela-08-quiz-apoio/index.html';
    }
  </script>

</body>
</html>
