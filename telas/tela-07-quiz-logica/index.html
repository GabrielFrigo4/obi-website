<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pergunta 2: Preferência de Desafios · Central OBI UFABC</title>
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../assets/css/screens.css">
  <script src="../../assets/js/utils.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>

  <main class="mobile-viewport">

    <header class="accessibility-bar" aria-label="Controles de Acessibilidade">
      <a href="../../index.html" class="brand-link" aria-label="Ir para a página inicial da Central OBI UFABC">
        <img class="brand-symbol" src="../../assets/img/obi-ufabc.jpeg" alt="" width="36" height="36"><span>OBI <small>UFABC</small></span>
      </a>
      <div class="accessibility-controls" role="group" aria-label="Ajustes visuais de fonte e contraste">
        <button id="btn-zoom-out" class="btn-a11y" type="button" aria-label="Diminuir tamanho da fonte">A-</button>
        <button id="btn-zoom-in" class="btn-a11y" type="button" aria-label="Aumentar tamanho da fonte">A+</button>
        <button id="btn-contrast" class="btn-a11y" type="button" aria-label="Alternar modo de alto contraste" aria-pressed="false">◐ Contraste</button>
      </div>
    </header>

    <nav class="page-header" aria-label="Navegação da tela">
      <a href="../tela-06-quiz-pergunta-1/index.html" class="btn-back" aria-label="Voltar para a Pergunta 1">
        <span aria-hidden="true">&larr;</span> Voltar
      </a>
    </nav>

    <section class="screen-content" aria-labelledby="screen-title">

      <div class="progress-container" aria-label="Progresso do Diagnóstico">
        <div class="progress-header">
          <span id="label-progresso-etapa">Pergunta 2 de 3</span>
          <span id="label-progresso-porcentagem" aria-hidden="true">66%</span>
        </div>
        <div class="progress-bar-track" 
             role="progressbar" 
             aria-valuenow="66" 
             aria-valuemin="0" 
             aria-valuemax="100" 
             aria-labelledby="label-progresso-etapa"
             aria-valuetext="Pergunta 2 de 3: 66 por cento concluído">
          <div class="progress-bar-fill w-66"></div>
        </div>
      </div>

      <h1 id="screen-title" class="screen-title">Descobrir Meu Nível</h1>
      <p class="screen-subtitle">Escolha o formato que combina mais com você.</p>

      <form id="form-pergunta-2" novalidate>
        <fieldset class="options-group" aria-describedby="status-feedback">
          <legend class="screen-subtitle quiz-legend" id="legend-pergunta-2">
            2. Qual é a sua preferência na hora de resolver desafios?
          </legend>

          <label class="option-card" for="opt-logica">
            <input type="radio" 
                   id="opt-logica" 
                   name="preferencia" 
                   value="logica" 
                   aria-describedby="desc-logica">
            <div class="option-text">
              <strong id="titulo-logica">Lógica e enigmas no papel</strong>
              <span id="desc-logica">Resolver desafios de raciocínio sem precisar programar (Modalidade Iniciação).</span>
            </div>
          </label>

          <label class="option-card" for="opt-codigo">
            <input type="radio" 
                   id="opt-codigo" 
                   name="preferencia" 
                   value="codigo" 
                   aria-describedby="desc-codigo">
            <div class="option-text">
              <strong id="titulo-codigo">Escrever código no computador</strong>
              <span id="desc-codigo">Programar soluções em Python, C/C++, Java ou JavaScript (Modalidade Programação).</span>
            </div>
          </label>
        </fieldset>

        <div id="status-feedback" 
             class="feedback-status" 
             role="status" 
             aria-live="polite" 
             aria-atomic="true">
        </div>

        <div class="screen-actions">
          <button type="button" id="btn-avancar" class="btn-primary">
            Avançar para Pergunta 3 &rarr;
          </button>
        </div>
      </form>

    </section>

  </main>

  <!-- Tradução automática de português para Libras (VLibras) -->
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js" defer></script>

</body>
</html>
