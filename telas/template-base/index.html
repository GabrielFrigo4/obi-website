<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nome da Tela · Central OBI UFABC</title>
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <script src="../../assets/js/utils.js" defer></script>
</head>
<body>

  <main class="mobile-viewport">

    <header class="accessibility-bar" aria-label="Controles de Acessibilidade">
      <a href="../../index.html" class="brand-link">
        <span>Central OBI</span>
      </a>
      <div class="accessibility-controls">
        <button id="btn-zoom-out" class="btn-a11y" aria-label="Diminuir tamanho da fonte">A-</button>
        <button id="btn-zoom-in" class="btn-a11y" aria-label="Aumentar tamanho da fonte">A+</button>
        <button id="btn-contrast" class="btn-a11y" aria-label="Ativar alto contraste">◐ Contraste</button>
      </div>
    </header>

    <nav class="page-header" aria-label="Navegação da tela">
      <a href="../../index.html" class="btn-back">
        <span aria-hidden="true">&larr;</span> Voltar
      </a>
    </nav>

    <section class="screen-content">

      <div class="progress-container" aria-label="Progresso da Etapa">
        <div class="progress-header">
          <span>Etapa 1 de 3</span>
          <span>33%</span>
        </div>
        <div class="progress-bar-track" role="progressbar" aria-valuenow="33" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-bar-fill" style="width: 33%;"></div>
        </div>
      </div>

      <h1 class="screen-title">Título Claro e Direto</h1>
      <p class="screen-subtitle">Subtítulo explicativo sem enrolação ou textos longos.</p>

      <fieldset class="options-group">
        <legend class="screen-subtitle" style="margin-bottom: 12px; font-weight: 600;">Selecione a sua opção:</legend>

        <label class="option-card">
          <input type="radio" name="exemplo_opcao" value="opcao_1" checked>
          <div class="option-text">
            <strong>Primeira Opção</strong>
            <span>Descrição curta de no máximo duas linhas explicando a opção.</span>
          </div>
        </label>

        <label class="option-card">
          <input type="radio" name="exemplo_opcao" value="opcao_2">
          <div class="option-text">
            <strong>Segunda Opção</strong>
            <span>Outra alternativa clara e com bom contraste.</span>
          </div>
        </label>
      </fieldset>

      <div class="screen-actions">
        <button type="button" class="btn-primary">Avançar para Próxima Etapa</button>
      </div>

    </section>

  </main>

</body>
</html>
