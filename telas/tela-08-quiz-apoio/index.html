<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pergunta 3: Série e Apoio Escolar · Central OBI UFABC</title>
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../assets/css/screens.css">
  <script src="../../assets/js/utils.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>

  <main class="mobile-viewport">

    <header class="accessibility-bar" aria-label="Controles de Acessibilidade">
      <a href="../../index.html" class="brand-link" aria-label="Ir para a página inicial da Central OBI UFABC">
        <img class="brand-symbol" src="../../assets/img/obi-ufabc.jpeg" alt="" width="36" height="36"><span>OBI <small>UFABC</small></span>
      </a>
      <div class="accessibility-controls" role="group" aria-label="Ajustes visuais de fonte e contraste">
        <button id="btn-zoom-out" class="btn-a11y" type="button" aria-label="Diminuir tamanho da fonte">A-</button>
        <button id="btn-zoom-in" class="btn-a11y" type="button" aria-label="Aumentar tamanho da fonte">A+</button>
        <button id="btn-contrast" class="btn-a11y" type="button" aria-label="Alternar modo de alto contraste" aria-pressed="false">◐ Contraste</button>
      </div>
    </header>

    <nav class="page-header" aria-label="Navegação da tela">
      <a href="../tela-07-quiz-logica/index.html" class="btn-back" aria-label="Voltar para a Pergunta 2">
        <span aria-hidden="true">&larr;</span> Voltar
      </a>
    </nav>

    <section class="screen-content" aria-labelledby="screen-title">

      <div class="progress-container" aria-label="Progresso do Diagnóstico">
        <div class="progress-header">
          <span id="label-progresso-etapa">Pergunta 3 de 3</span>
          <span id="label-progresso-porcentagem" aria-hidden="true">100%</span>
        </div>
        <div class="progress-bar-track" 
             role="progressbar" 
             aria-valuenow="100" 
             aria-valuemin="0" 
             aria-valuemax="100" 
             aria-labelledby="label-progresso-etapa"
             aria-valuetext="Pergunta 3 de 3: 100 por cento concluído">
          <div class="progress-bar-fill w-100"></div>
        </div>
      </div>

      <h1 id="screen-title" class="screen-title">Descobrir Meu Nível</h1>
      <p class="screen-subtitle">Última etapa para identificar a sua categoria e o apoio disponível.</p>

      <form id="form-pergunta-3" novalidate>
        <fieldset class="options-group" aria-describedby="status-feedback">
          <legend class="screen-subtitle quiz-legend" id="legend-pergunta-3">
            3. Qual é a sua série e situação da sua escola na OBI?
          </legend>

          <label class="option-card" for="opt-fundamental">
            <input type="radio" 
                   id="opt-fundamental" 
                   name="escola_apoio" 
                   value="fundamental_com_apoio" 
                   aria-describedby="desc-fundamental">
            <div class="option-text">
              <strong id="titulo-fundamental">Ensino Fundamental (6º ao 9º ano)</strong>
              <span id="desc-fundamental">Minha escola já participa ou quero ver materiais do Nível Júnior / Iniciação.</span>
            </div>
          </label>

          <label class="option-card" for="opt-medio">
            <input type="radio" 
                   id="opt-medio" 
                   name="escola_apoio" 
                   value="medio_com_apoio" 
                   aria-describedby="desc-medio">
            <div class="option-text">
              <strong id="titulo-medio">Ensino Médio ou Técnico</strong>
              <span id="desc-medio">Quero ver materiais e cronograma para Nível 1 ou 2.</span>
            </div>
          </label>

          <label class="option-card" for="opt-sem-cadastro">
            <input type="radio" 
                   id="opt-sem-cadastro" 
                   name="escola_apoio" 
                   value="escola_sem_cadastro" 
                   aria-describedby="desc-sem-cadastro">
            <div class="option-text">
              <strong id="titulo-sem-cadastro">Minha escola não participa (ou não sei)</strong>
              <span id="desc-sem-cadastro">Quero apoio gratuito do projeto da UFABC para conseguir participar.</span>
            </div>
          </label>
        </fieldset>

        <div id="status-feedback" 
             class="feedback-status" 
             role="status" 
             aria-live="polite" 
             aria-atomic="true">
        </div>

        <div class="screen-actions">
          <button type="button" id="btn-finalizar" class="btn-primary">
            Ver Meu Resultado &rarr;
          </button>
        </div>
      </form>

    </section>

  </main>

  <!-- Tradução automática de português para Libras (VLibras) -->
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js" defer></script>

</body>
</html>
