<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pergunta 3: Série e Apoio Escolar · Central OBI UFABC</title>
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <script src="../../assets/js/utils.js" defer></script>
</head>
<body>

  <main class="mobile-viewport">

    <header class="accessibility-bar" aria-label="Controles de Acessibilidade">
      <a href="../../index.html" class="brand-link">
        <span>Central OBI</span>
      </a>
      <div class="accessibility-controls">
        <button id="btn-zoom-out" class="btn-a11y" aria-label="Diminuir tamanho da fonte">A-</button>
        <button id="btn-zoom-in" class="btn-a11y" aria-label="Aumentar tamanho da fonte">A+</button>
        <button id="btn-contrast" class="btn-a11y" aria-label="Ativar alto contraste">◐ Contraste</button>
      </div>
    </header>

    <nav class="page-header" aria-label="Navegação da tela">
      <a href="../tela-07-quiz-logica/index.html" class="btn-back">
        <span aria-hidden="true">&larr;</span> Voltar
      </a>
    </nav>

    <section class="screen-content">

      <div class="progress-container" aria-label="Progresso do Diagnóstico">
        <div class="progress-header">
          <span>Pergunta 3 de 3</span>
          <span>100%</span>
        </div>
        <div class="progress-bar-track" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-bar-fill" style="width: 100%;"></div>
        </div>
      </div>

      <h1 class="screen-title">Descobrir Meu Nível</h1>
      <p class="screen-subtitle">Última etapa para identificar a sua categoria e o apoio disponível.</p>

      <fieldset class="options-group">
        <legend class="screen-subtitle" style="margin-bottom: 12px; font-weight: 600; color: var(--cor-texto-principal);">
          3. Qual é a sua série e situação da sua escola na OBI?
        </legend>

        <label class="option-card" for="opt-fundamental">
          <input type="radio" id="opt-fundamental" name="escola_apoio" value="fundamental_com_apoio" checked>
          <div class="option-text">
            <strong>Ensino Fundamental (6º ao 9º ano)</strong>
            <span>Minha escola já participa ou quero ver materiais do Nível Júnior / Iniciação.</span>
          </div>
        </label>

        <label class="option-card" for="opt-medio">
          <input type="radio" id="opt-medio" name="escola_apoio" value="medio_com_apoio">
          <div class="option-text">
            <strong>Ensino Médio ou Técnico</strong>
            <span>Quero ver materiais e cronograma para Nível 1 ou 2.</span>
          </div>
        </label>

        <label class="option-card" for="opt-sem-cadastro">
          <input type="radio" id="opt-sem-cadastro" name="escola_apoio" value="escola_sem_cadastro">
          <div class="option-text">
            <strong>Minha escola não participa (ou não sei)</strong>
            <span>Quero apoio gratuito do projeto da UFABC para conseguir participar.</span>
          </div>
        </label>
      </fieldset>

      <div class="screen-actions">
        <button type="button" id="btn-finalizar" class="btn-primary" onclick="concluirQuiz()">
          Ver Meu Resultado &rarr;
        </button>
      </div>

    </section>

  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const respostas = typeof obterRespostas === 'function' ? obterRespostas() : {};
      const valorSalvo = respostas['escola_apoio'];
      if (valorSalvo) {
        const radio = document.querySelector('input[name="escola_apoio"][value="' + valorSalvo + '"]');
        if (radio) {
          radio.checked = true;
          document.querySelectorAll('.option-card').forEach(function (cartao) {
            cartao.classList.remove('selected');
          });
          const cardPai = radio.closest('.option-card');
          if (cardPai) {
            cardPai.classList.add('selected');
          }
        }
      }
    });

    function concluirQuiz() {
      const selecionado = document.querySelector('input[name="escola_apoio"]:checked');
      const valor = selecionado ? selecionado.value : 'fundamental_com_apoio';
      salvarResposta('escola_apoio', valor);
      window.location.href = '../tela-09-resultado-nivel/index.html';
    }
  </script>

</body>
</html>
